<body><div id="app"><canvas aria-label="국궁 활터. 상하좌우 위치로 조준한 뒤 활 당기기 버튼을 사용하세요."></canvas><header class="top"><div class="brand"><small>부천활박물관 · 국궁 체험</small><h1>국궁 한 순 대결</h1></div><div class="wind"><small>오늘의 바람</small><strong id="wind"></strong></div></header><aside class="scoreboard"><h2>한 순 · 다섯 발의 기록</h2><div id="records"></div></aside><div class="reticle"></div><div class="rotate">태블릿을 가로로 돌려 주세요</div><footer class="bottom"><div class="instruction"><small id="phase">처음 만나는 활터</small><h2 id="status">바람을 읽고, 활을 당겨 보세요</h2><p id="hint">화면 클릭·터치로 조준 고정 → 아래 가운데 버튼을 꾹 누르고 손 떼기</p><div class="power"><i id="power"></i></div></div><div class="controls"><button id="camera">카메라: 추적</button><button id="home">처음으로</button></div></footer><button id="draw" class="draw" aria-label="꾹 누르면 세기가 차오르고 손을 떼면 발사. 키보드는 엔터나 스페이스를 누르고 놓기.">꾹 눌러 발사<small>누를수록 강하게 · 놓으면 발사<br>밖으로 끌면 취소</small></button><div id="toast" class="toast hidden" role="status" aria-live="polite"></div><div id="overlay" class="overlay"><section class="panel"><h2>활터를 준비하고 있어요</h2><p>3D 라이브러리를 불러오는 중입니다. 인터넷 연결이 필요합니다.</p></section></div></div></body>
