function wtex(t,c){return cv(512,448,x=>{const rr=(a,b,w,h,r)=>{x.beginPath();x.roundRect?x.roundRect(a,b,w,h,r):x.rect(a,b,w,h)};

 for(let y=0,r=0;y<448;r++){const h=50+Math.random()*36;let xx=-((r*37)%60)-10;while(xx<512){const w=70+Math.random()*75;x.fillStyle=gr[(Math.random()*gr.length)|0];rr(xx+3,y+3,w-6,h-6,16);x.fill();x.fillStyle='rgba(255,255,255,.14)';rr(xx+8,y+6,w-18,(h-6)*.38,12);x.fill();x.fillStyle='rgba(0,0,0,.2)';for(let i=0;i<14;i++)x.fillRect(xx+8+Math.random()*(w-20),y+8+Math.random()*(h-20),2,2);if(Math.random()<.2){x.fillStyle='rgba(90,130,60,.45)';rr(xx+6,y+h-16,w*.5,9,5);x.fill()}xx+=w}y+=h}
