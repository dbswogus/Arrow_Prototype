<script>
'use strict';
(() => {
const canvas=document.getElementById('game');

const p3=program(`attribute vec3 position;attribute vec3 normal;uniform mat4 mvp;uniform mat4 model;varying float light;void main(){vec3 n=normalize(mat3(model)*normal);light=.61+.39*max(dot(n,normalize(vec3(-.4,.8,1.))),0.);gl_Position=mvp*vec4(position,1.);}`,`precision mediump float;uniform vec3 color;varying float light;void main(){gl_FragColor=vec4(color*light,1.);}`);

  route:[[-7.6,3.8],[-5,3.8],[-5,-3.8],[0,-3.8],[0,3.2],[5,3.2],[5,-3.8],[7.1,-3.8]],checks:[2,4,6],rooms:[{x:-5,z:-3.8,r:1.65},{x:0,z:3.2,r:1.65},{x:5,z:-3.8,r:1.65}],

function segmentDistance(x,z,a,b){const dx=b[0]-a[0],dz=b[1]-a[1],t=clamp(((x-a[0])*dx+(z-a[1])*dz)/(dx*dx+dz*dz),0,1);return Math.hypot(x-a[0]-dx*t,z-a[1]-dz*t);}

 const patches=cornerPatches(surface);surface.wallSegments=[];const vv=[],nn=[],wv=[],wn=[];function face(p,n,vs=vv,ns=nn){for(const i of[0,1,2,0,2,3]){vs.push(...p[i]);ns.push(...n);}}
 function wall(x,z,w,d){if(!patches.some(p=>Math.hypot(x-p.x,z-p.z)<=p.r))return;surface.wallSegments.push({x,z,w,d});const a=x-w/2,b=x+w/2,c=z-d/2,e=z+d/2,h=.28;face([[a,h,e],[b,h,e],[b,h,c],[a,h,c]],[0,1,0],wv,wn);face([[a,0,e],[b,0,e],[b,h,e],[a,h,e]],[0,0,1],wv,wn);face([[b,0,c],[a,0,c],[a,h,c],[b,h,c]],[0,0,-1],wv,wn);face([[a,0,c],[a,0,e],[a,h,e],[a,h,c]],[-1,0,0],wv,wn);face([[b,0,e],[b,0,c],[b,h,c],[b,h,e]],[1,0,0],wv,wn);}

 face([[x,0,Z],[X,0,Z],[X,0,z],[x,0,z]],[0,1,0]);

  for(const room of st.rooms)for(let i=0;i<4;i++){const a=i*TAU/4;block(root,room.x+Math.cos(a)*1.5,.015,room.z+Math.sin(a)*1.5,.12,.025,.12,'#e6c497');}
 }else if(stage===1){
  for(const x of[-2.5,2.5]){block(root,x,.65,0,2.05,1.3,3.1,'#a96f4b');block(root,x,1.5,0,1.65,.45,2.55,'#bb8960');block(root,x,2.1,0,.8,.85,1,'#bf9970');block(root,x-.01,.45,1.59,1.02,.88,.06,'#5b5144');for(let i=0;i<4;i++)block(root,x-.82+i*.55,1.3,.02,.07,.06,3.1,'#e0b28b');}
  for(const x of[-5,0,5])for(let z=-2.8;z<3;z+=.62){if(!inHole(st,x,z))block(root,x,.021,z,2.2,.035,.12,'#d1a574');}
 }else{
  for(const x of[-2.7,2.7]){block(root,x,.22,-.75,2.3,.44,2.25,'#c5c7b4');block(root,x,.49,-.75,2.08,.1,2.03,'#e0decb');pot(mul(root,translate(x,.98,-.75)),x<0?1:2,0,.8);for(const dx of[-.95,.95])for(const dz of[-.9,.9])block(root,x+dx,1.15,-.75+dz,.065,1.22,.065,'#a3b9ae');block(root,x,1.79,-.75,2.08,.075,2.03,'#d5dfd1');}
  for(const [x,z]of[[-9,-5.2],[8,-5.2],[-9,5.2],[8,5.2]]){block(root,x,.85,z,.48,1.7,.48,'#c1c8b5');block(root,x,1.74,z,.7,.12,.7,'#d5d9c5');}
 }
}
function worldScene(){
 vp=mul(ortho(-15/.9,15/.9,-9.375/.9,9.375/.9,-55,55),mul(translate(0,.9,0),rx(1.18)));
 const root=mul(rz(angle),rx(tiltZ)),st=STAGES[stage];
 // The canvas clear colour is the full-bleed backdrop; no bounded background slab.
 for(const sf of st.surfaces){const base=mul(root,translate(0,sf.height,0));
  if(st.levels){for(const p of [sf.route[0],sf.route.at(-1)]){const h=sf.height+1.8;block(root,p[0],sf.height-h/2-.3,p[1],.7,h,.7,'#a4b0ac');}block(base,sf.route[0][0],-.23,sf.route[0][1],1.9,.13,1.9,'#82979c');}
  draw(sf.floor,base,st.color);draw(sf.walls,base,'#e6d5ad');
  for(let j=1;j<sf.route.length;j++){const a=sf.route[j-1],b=sf.route[j],len=Math.hypot(b[0]-a[0],b[1]-a[1]);for(let d=.5;d<len-.4;d+=.7){const t=d/len,x=mix(a[0],b[0],t),z=mix(a[1],b[1],t);if(!inHole(sf,x,z)&&!sf.crumbles.some(r=>inRect(x,z,r)))block(base,x,.014,z,.1,.025,.1,'#eee2c5');}}
  for(let i=0;i<sf.holes.length;i++){const h=sf.holes[i];draw(sf.rims[i],mul(base,translate(h.x,0,h.z)),'#d17f56');block(base,h.x,-2.3,h.z,h.r*1.4,.08,h.r*1.4,'#746659');}
  for(const index of st.checks){if((st.checkLevels?.[index]||0)!==sf.level)continue;const p=st.route[index];block(base,p[0],.02,p[1],1.15,.04,1.15,index<=checkpoint.index?'#6b9b69':'#a0ba85');block(base,p[0],.05,p[1],.6,.03,.6,'#dce7b4');}
  for(let i=0;i<sf.crumbles.length;i++){const r=sf.crumbles[i],c=crumbles[i];if(c.down>0)continue;const shake=c.charge>0?Math.sin(simulationTime*48)*.025:0;block(base,r.x,.015+shake,r.z,r.w+.15,.12,r.d+.15,c.charge>1.6?'#cf6950':'#c99c63');for(let j=0;j<3;j++)block(base,r.x+(j-1)*r.w*.2,.085+shake,r.z+(j%2?.12:-.12),r.w*.12,.018,r.d*.7,'#795d43',.3);}
  for(const h of sf.sweepers){const q=sweeperAt(h,simulationTime);block(base,h.x,-.02,h.z,h.axis==='x'?h.amp*2+.7:.22,.03,h.axis==='z'?h.amp*2+.7:.22,'#bd7c57');block(base,q.x,.38,q.z,q.w,.76,q.d,'#c75f44');block(base,q.x,.79,q.z,q.w*.8,.07,q.d*.8,'#f2c185');}
 }
 mapScenery(root);
 const last=st.surfaces.at(-1),goalRoot=mul(root,translate(0,last.height,0)),g=st.route.at(-1);block(goalRoot,g[0],.04,g[1],1.7,.08,1.7,'#779d67');block(goalRoot,g[0],.1,g[1],1.15,.05,1.15,'#d6dfad');block(goalRoot,g[0]+1,.85,g[1]+.7,.09,1.7,.09,'#789068');block(goalRoot,g[0]+.55,1.55,g[1]+.7,.9,.42,.07,'#9ebc79');
 for(let i=0;i<4;i++){const x=i%2===0?-11:10.4,z=-4+i*2.8;block(root,x,-.5,z,1.7,.7,1.7,'#b6ba9f');if(stage===1){block(root,x,.3,z,1.5,.9,1.5,'#b98a64');block(root,x,1.1,z,.65,.85,.65,'#c69b76');}else pot(mul(root,translate(x,.45,z)),i%3,0,.72);}
 if(!falling)block(root,px,py+.025,pz,.6,.035,.55,'#7a735f');
 const drop=falling?Math.min(5,fallTime*fallTime*6):0;pot(mul(root,mul(translate(px,py+.47-drop,pz),rx(rollX))),selected,roll,.66);
}

function scene(clear=true){gl.disable(gl.BLEND);gl.enable(gl.DEPTH_TEST);gl.clearColor(...rgb(screen==='play'?'#dce1d4':C.cream),1);gl.clear(clear?gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT:gl.DEPTH_BUFFER_BIT);
 if(screen==='play'){
 worldScene();
 }else if(screen==='title'){
 vp=ortho(0,16,0,10,-30,30);pot(mul(translate(11.65,4.72,0),mul(rx(.14),ry(-.18))),0,0,2.0);
 }else if(screen==='select'){
 vp=ortho(0,16,0,10,-30,30);for(let i=0;i<COLLECTION.length;i++){const x=(70+(i%3)*300+139)/100,y=293+Math.floor(i/3)*241;pot(mul(translate(x,(H-y-83)/100,0),mul(rx(.14),ry(-.2))),i,0,.65);}pot(mul(translate(12.6,5.7,0),mul(rx(.14),ry(-.2))),selected,0,.8);
 }else if(screen==='finish'){
 vp=ortho(0,16,0,10,-30,30);pot(mul(translate(11.85,4.65,0),mul(rx(.18),ry(-.2))),selected,0,1.3);
 }else if(screen==='story'||screen==='brief'){
 vp=ortho(0,16,0,10,-30,30);const root=translate(12.5,4.9,0);block(identity(),12.5,3.5,-1,3.6,.22,1.4,'#b9ac86');pot(mul(root,mul(rx(.12),ry(-.22))),selected,storyIndex===0?-.18:0,1.5);if(screen==='story'&&storyIndex===0){for(const x of[11.4,13.6])pot(mul(translate(x,3.1,-1),rx(.15)),(selected+1)%3,0,.35);}else{block(identity(),13.9,5.1,-2,.08,3,.08,'#9bac7e');block(identity(),13.25,6.4,-2,1.3,.65,.1,'#98ad77');}
 }
}
function render(){gl.viewport(Math.round(layout.x*layout.dpr),Math.round((innerHeight-layout.y-layout.h)*layout.dpr),Math.round(layout.w*layout.dpr),Math.round(layout.h*layout.dpr));scene();if(dirty)drawUI();gl.disable(gl.DEPTH_TEST);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.useProgram(pu);gl.bindBuffer(gl.ARRAY_BUFFER,quad);const p=gl.getAttribLocation(pu,'position');gl.enableVertexAttribArray(p);gl.vertexAttribPointer(p,2,gl.FLOAT,false,0,0);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.uniform1i(gl.getUniformLocation(pu,'image'),0);gl.drawArrays(gl.TRIANGLES,0,6);if(!portrait&&['title','select','finish','story','brief'].includes(screen))scene(false);}
function resize(){const dpr=Math.min(window.devicePixelRatio||1,2),vw=innerWidth,vh=innerHeight,ratio=Math.min(vw/W,vh/H);layout={x:(vw-W*ratio)/2,y:(vh-H*ratio)/2,w:W*ratio,h:H*ratio,dpr};canvas.style.width=vw+'px';canvas.style.height=vh+'px';canvas.width=Math.round(vw*dpr);canvas.height=Math.round(vh*dpr);gl.viewport(0,0,canvas.width,canvas.height);portrait=vw<vh;clearInput();dirty=true;}
function hit(e){const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left-layout.x)/layout.w*W,y=(e.clientY-r.top-layout.y)/layout.h*H;return buttons.findLast(b=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h);}
function action(id){if(id.startsWith('pot')){const index=Number(id.slice(3));if(Number.isInteger(index)&&index>=0&&index<COLLECTION.length)selected=index;dirty=true;return;}clearInput();if(id==='title')screen='title';if(id==='select')screen='select';if(id==='guide')screen='guide';if(id==='start'||id==='replay'){totalTime=0;failures=0;storyIndex=0;screen='story';}if(id==='story-next'){if(storyIndex<2)storyIndex++;else startStage(0);}if(id==='begin'){screen='play';notify(STAGES[stage].tip,6);}dirty=true;}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.focus({preventScroll:true});const p=pointerPosition(e);if(screen==='play'&&!falling&&!done&&stick.id===null&&Math.hypot(p.x-stick.cx,p.y-stick.cy)<=125){stick.id=e.pointerId;canvas.setPointerCapture(e.pointerId);updateStick(e);return;}const b=hit(e);if(b){canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,'menu:'+b.id);}dirty=true;});
canvas.addEventListener('pointermove',e=>{if(e.pointerId===stick.id)updateStick(e);});
canvas.addEventListener('pointerup',e=>{if(e.pointerId===stick.id){releaseStick();return;}const value=pointers.get(e.pointerId);pointers.delete(e.pointerId);if(value&&value.startsWith('menu:')){const b=hit(e);if(b&&value==='menu:'+b.id)action(b.id);}dirty=true;});
canvas.addEventListener('pointercancel',e=>{if(e.pointerId===stick.id)releaseStick();pointers.delete(e.pointerId);dirty=true;});
canvas.addEventListener('lostpointercapture',e=>{if(e.pointerId===stick.id)releaseStick();pointers.delete(e.pointerId);dirty=true;});
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)&&screen==='play'){e.preventDefault();if(!done&&!falling)keys.add(e.key);dirty=true;}});window.addEventListener('keyup',e=>{keys.delete(e.key);dirty=true;});window.addEventListener('blur',clearInput);document.addEventListener('visibilitychange',()=>{clearInput();last=0;acc=0;});window.addEventListener('resize',resize);
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();contextLost=true;clearInput();canvas.style.display='none';document.getElementById('error').style.display='block';document.getElementById('error').textContent='그래픽 연결이 잠시 끊겼어요. 페이지를 새로 열어 주세요.';});
function frame(ms){if(contextLost)return;const dt=last?Math.min((ms-last)/1000,.08):0;last=ms;if(!document.hidden){acc+=dt;while(acc>=1/120){tick(1/120);acc-=1/120;}render();}requestAnimationFrame(frame);}
// Read-only snapshot for smoke tests and diagnostics; never controls the game.
Object.defineProperty(window,'onggiState',{get:()=>({screen,stage,selected,angle,tiltZ,px,pz,vx,vz,checkpoint:{...checkpoint},floorLevel,py,done,falling,failures,crumbles:crumbles.map(c=>({...c}))})});
resize();requestAnimationFrame(frame);
})();
</script>
